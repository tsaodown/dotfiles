name: install

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # git-stack needed by bin-link + `make test`

      - name: Configure git identity      # pre-set so the installer skips its identity prompt
        run: |
          git config --global user.name "dotfiles CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Clear pre-existing stow conflicts
        run: rm -f "$HOME/.zshrc"          # macOS runners ship a real ~/.zshrc; stow would refuse

      - name: Install (non-interactive)
        run: DOTFILES_CI=1 make install < /dev/null   # </dev/null: any stray read gets EOF, fails fast

      - name: Assert symlinks resolve into the repo
        run: |
          set -euo pipefail
          repo="$PWD"
          for pair in \
            "$HOME/.zshrc:zsh/.zshrc" \
            "$HOME/.config/fish/config.fish:fish/.config/fish/config.fish" \
            "$HOME/.tmux.conf:tmux/.tmux.conf" \
            "$HOME/.config/kitty/kitty.conf:kitty/.config/kitty/kitty.conf"; do
            link="${pair%%:*}"; target="$repo/${pair##*:}"
            [ -L "$link" ] || { echo "FAIL not a symlink: $link"; exit 1; }
            [ "$link" -ef "$target" ] || { echo "FAIL $link !-> $target"; exit 1; }
          done
          echo "all symlinks resolve into the repo"

      - name: Re-run install (idempotency)
        run: DOTFILES_CI=1 make install < /dev/null

      - name: Run test suite
        run: make test JOBS=4
