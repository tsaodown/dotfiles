name: install

# Paths with no test coverage and no bearing on whether `make install` succeeds.
# A run is skipped only when EVERY changed file matches, so the watcher batching
# a claude/ edit together with a bin/ edit still runs.
#
# Denylist rather than allowlist on purpose: a new top-level directory should
# start out tested, not silently exempt. Notably NOT ignored — the git-stack
# gitlink, whose bumps are what caught the unresolvable-pointer bug twice.
#
# claude/ and cursor/ are the churn (28 and 2 of the last 120 commits) and no
# test references either. claude/ is a stowed package, so a structural change
# there could break `make install` — but install stows everything on every run,
# so that surfaces on the next commit touching anything unignored. A delay, not
# a blind spot.
#
# The lists are duplicated because GitHub Actions does not expand YAML anchors.
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'        # root-level (README, CLAUDE.md, CONTEXT.md)
      - '**/*.md'     # nested; whether ** alone covers root is ambiguous, so both
      - 'docs/**'
      - 'claude/**'
      - 'cursor/**'
  pull_request:
    paths-ignore:
      - '*.md'        # root-level (README, CLAUDE.md, CONTEXT.md)
      - '**/*.md'     # nested; whether ** alone covers root is ambiguous, so both
      - 'docs/**'
      - 'claude/**'
      - 'cursor/**'
  workflow_dispatch:   # manual escape hatch when a skipped run needs verifying

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # git-stack needed by bin-link + `make test`

      - name: Configure git identity      # pre-set so the installer skips its identity prompt
        run: |
          git config --global user.name "dotfiles CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Clear pre-existing stow conflicts
        run: rm -f "$HOME/.zshrc"          # macOS runners ship a real ~/.zshrc; stow would refuse

      - name: Install (non-interactive)
        run: DOTFILES_CI=1 make install < /dev/null   # </dev/null: any stray read gets EOF, fails fast

      - name: Assert stowed files resolve into the repo
        run: |
          set -euo pipefail
          repo="$PWD"
          # `-ef` (same inode+device) resolves through stow's folded directory
          # symlinks, so it proves the path points at the repo file whether stow
          # linked the leaf (zsh/tmux: parent $HOME exists) or folded a parent dir
          # (fish/kitty: ~/.config/<pkg> becomes one dir symlink). A leaf `-L` check
          # would wrongly fail the folded packages.
          for pair in \
            "$HOME/.zshrc:zsh/.zshrc" \
            "$HOME/.config/fish/config.fish:fish/.config/fish/config.fish" \
            "$HOME/.tmux.conf:tmux/.tmux.conf" \
            "$HOME/.config/kitty/kitty.conf:kitty/.config/kitty/kitty.conf"; do
            link="${pair%%:*}"; target="$repo/${pair##*:}"
            [ "$link" -ef "$target" ] || { echo "FAIL $link does not resolve to $target"; exit 1; }
          done
          echo "all stowed files resolve into the repo"

      - name: Re-run install (idempotency)
        run: DOTFILES_CI=1 make install < /dev/null

      # `make install` disables the watcher group under DOTFILES_CI (the daemon
      # can't run headless), which also skips its dependencies — and every
      # watcher test self-skips without a file-event backend. Install the group
      # so the 26 watcher tests actually execute instead of reporting a green
      # skip. It's the whole group, not just the backend: the timeout-backstop
      # test needs gtimeout, which on macOS ships in coreutils. Package names
      # come from deps.tsv rather than being repeated here.
      - name: Install watcher dependencies
        run: |
          set -euo pipefail
          # deps.tsv columns: probe(s), darwin pkg, linux pkg, required, desc
          [ "$RUNNER_OS" = "macOS" ] && col=2 || col=3
          pkgs=$(./bin/dotfiles-deps list watcher | awk -F'\t' -v c="$col" '$c != "-" { print $c }')
          echo "installing: $pkgs"
          if [ "$RUNNER_OS" = "macOS" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install $pkgs
          else
            sudo apt-get update -qq && sudo apt-get install -y $pkgs
          fi

      - name: Run test suite      # SUBMODULE_TESTS=0 skips git-stack's tests (it has its own CI)
        run: |
          set -euo pipefail
          make test JOBS=4 SUBMODULE_TESTS=0 2>&1 | tee /tmp/bats.log
          # A backend that silently stops being installed turns every watcher
          # test into a green skip, which reads identically to passing.
          if grep -q "skip neither fswatch nor inotifywait" /tmp/bats.log; then
            echo "FAIL watcher tests self-skipped — the file-event backend is missing"
            exit 1
          fi
