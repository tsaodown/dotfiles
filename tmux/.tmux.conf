set -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g set-titles on

unbind C-b
set -g prefix 0xe7
bind 0xe7 send-prefix # Alt-c

# Vim style pane selection
bind 0x2d9  select-pane -L # Alt-h
bind 0x2206 select-pane -D # Alt-j
bind 0x2da  select-pane -U # Alt-k
bind 0xac   select-pane -R # Alt-l

# Start windows and panes at 1, not 0
set  -g base-index 1
setw -g pane-base-index 1

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

run '/opt/homebrew/opt/tpm/share/tpm/tpm'

# Show directory basename in window labels instead of foreground process.
# Must come after tpm's run, which loads catppuccin's hardcoded formats.
setw -g window-status-format         "#[fg=#1e1e2e,bg=#89b4fa] #I #[fg=#cdd6f4,bg=#313244] #{b:pane_current_path} "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#fab387] #I #[fg=#cdd6f4,bg=#313244] #{b:pane_current_path} "

# set vi-mode
set -gw mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind 0x2211 killp                                     # Alt-w
bind 0xe7   new-window                                # Alt-c
bind 0x3c0  split-window -v -c "#{pane_current_path}" # Alt-p
bind 0xf8   split-window -h -c "#{pane_current_path}" # Alt-o
bind 0xe6   resize-pane -Z                            # Alt-'
bind 0x2264 previous-window                           # Alt-,
bind 0x2265 next-window                               # Alt-.
bind 0xb5   select-window -t :^                       # Alt-m
bind 0xf7   select-window -t :$                       # Alt-/

# per-machine overrides
source-file -q ~/.tmux.conf.local
